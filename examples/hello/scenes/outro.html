<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071018; }
  body { color: #f4f7ff; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .stage { position: relative; height: 100%; display: grid; place-items: center; }
  .wash {
    position: absolute; inset: 0;
    background:
      radial-gradient(55% 60% at 80% 20%, rgba(79, 140, 255, .28), transparent 70%),
      radial-gradient(45% 50% at 15% 85%, rgba(139, 92, 246, .22), transparent 70%);
  }
  .copy { position: relative; width: 80%; }
  .tag { color: #8fb4ff; letter-spacing: .5em; text-transform: uppercase; font-size: 1vw;
    animation: fade-in .6s ease-out both; }
  h2 { margin: 1.2vw 0 1.4vw; font-size: 5.6vw; line-height: 1; letter-spacing: -.04em;
    animation: rise 1s cubic-bezier(.16, 1, .3, 1) .1s both; }
  .cmd {
    display: inline-block; margin-top: 1.2vw; padding: 1.1vw 1.6vw; border: 1px solid rgba(143, 180, 255, .35);
    border-radius: .55vw; background: rgba(10, 18, 32, .75); color: #d7e4ff;
    font: 1.25vw ui-monospace, SFMono-Regular, Menlo, monospace;
    animation: fade-in .8s ease-out .55s both;
  }
  .cmd b { color: #8fb4ff; font-weight: 500; }
  .foot { position: absolute; left: 10%; bottom: 8%; display: flex; gap: 2vw; color: #6f7d99;
    font-size: .9vw; letter-spacing: .16em; text-transform: uppercase;
    animation: fade-in .8s ease-out 1s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(2.5vw); } to { opacity: 1; transform: none; } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
  <div class="stage">
    <div class="wash"></div>
    <div class="copy">
      <div class="tag">now it is yours</div>
      <h2>Edit the JSON.<br />Re-render. Repeat.</h2>
      <div class="cmd"><b>$</b> vigo render examples/hello/vigo.json</div>
      <div class="foot"><span>html scenes</span><span>json timeline</span><span>mcp ready</span></div>
    </div>
  </div>
</body>
</html>

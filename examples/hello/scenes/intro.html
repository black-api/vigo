<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05070d; }
  body {
    color: #f4f7ff;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: relative; height: 100%; display: grid; place-items: center; }
  .aurora {
    position: absolute; inset: -20%;
    background:
      radial-gradient(40% 45% at 25% 35%, rgba(79, 140, 255, .55), transparent 70%),
      radial-gradient(38% 42% at 72% 62%, rgba(139, 92, 246, .45), transparent 70%),
      radial-gradient(30% 32% at 58% 28%, rgba(34, 211, 238, .25), transparent 70%);
    filter: blur(30px);
    animation: drift 5s ease-in-out both;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 6vw 6vw;
    mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 78%);
  }
  .copy { position: relative; width: 82%; max-width: 72rem; }
  .eyebrow {
    font-size: 1.05vw; letter-spacing: .58em; text-transform: uppercase; color: #8fb4ff;
    animation: fade-in .7s ease-out .1s both;
  }
  h1 {
    margin: 1.4vw 0 1.6vw; font-size: 7.2vw; line-height: .94; letter-spacing: -.045em; font-weight: 700;
    animation: rise 1.1s cubic-bezier(.16, 1, .3, 1) .15s both;
  }
  h1 em { font-style: normal; color: #8fb4ff; }
  p {
    margin: 0; max-width: 58%; font-size: 1.6vw; line-height: 1.55; color: #a9b4ca;
    animation: fade-in .8s ease-out .55s both;
  }
  .rule {
    margin-top: 3vw; height: 2px; width: 100%; background: rgba(255,255,255,.1); overflow: hidden;
  }
  .rule::after {
    content: ""; display: block; height: 100%; width: 100%; background: #4f8cff;
    transform-origin: left; animation: sweep 4s linear both;
  }
  .meta {
    position: absolute; left: 9%; bottom: 7%; display: flex; gap: 2.4vw;
    font-size: .95vw; letter-spacing: .18em; text-transform: uppercase; color: #6f7d99;
    animation: fade-in .8s ease-out 1s both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(3vw); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes drift {
    from { transform: translate3d(-2%, 1%, 0) scale(1); }
    to { transform: translate3d(2%, -1%, 0) scale(1.06); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="aurora"></div>
    <div class="grid"></div>
    <div class="copy">
      <div class="eyebrow">vigo / episode 01</div>
      <h1>Make video<br />with <em>markup.</em></h1>
      <p>Every scene is HTML. Every edit is JSON. Every frame is deterministic, so agents can iterate without guessing.</p>
      <div class="rule"></div>
    </div>
    <div class="meta"><span>1280 x 720</span><span>30 fps</span><span>html to mp4</span></div>
  </div>
</body>
</html>
